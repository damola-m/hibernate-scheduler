name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: From the release you downloaded, e.g. v1.1.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: powercfg
    attributes:
      label: Output of `powercfg /a`
      render: text
  - type: dropdown
    id: remote
    attributes:
      label: Is the OneDrive remote trigger involved?
      options:
        - "No"
        - "Yes"
